name: Between Us CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Verify Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Deterministic Dependency Installation
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run Complete Automated Security Test Suite
        run: npm test

      - name: Run Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Build Production Application Bundle
        run: npm run build

      - name: Verify Bundle Secret Exposure
        run: |
          if grep -rn "NEXT_PUBLIC_TURN_SHARED_SECRET" .next/; then
            echo "CRITICAL SECURITY ERROR: TURN Shared Secret leaked in build bundle!"
            exit 1
          fi
